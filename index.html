<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Research</title>
  <meta name="description" content="Deep dive into OpenClaw architecture and internals">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #f97316;
    }
    .sidebar-nav > ul > li > a {
      font-weight: 600;
    }
    .markdown-section h1 {
      border-bottom: 2px solid var(--theme-color);
      padding-bottom: 0.5rem;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'OpenClaw Research',
      repo: 'Elarwei001/research_openclaw',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Search',
        noData: 'No results',
        depth: 3
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied'
      }
    }
  </script>
  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <!-- Mermaid diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    .mermaid-wrapper {
      position: relative;
      margin: 1em 0;
    }
    .mermaid-toggle {
      position: absolute;
      top: 5px;
      right: 5px;
      padding: 4px 8px;
      font-size: 12px;
      background: #f97316;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      z-index: 10;
    }
    .mermaid-toggle:hover {
      background: #ea580c;
    }
    .mermaid-source {
      display: none;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 1em;
      border-radius: 4px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 13px;
      white-space: pre;
    }
    .mermaid-wrapper.show-source .mermaid-diagram { display: none; }
    .mermaid-wrapper.show-source .mermaid-source { display: block; }
  </style>
  <script>
    mermaid.initialize({ 
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose'
    });
    
    function toggleMermaid(btn) {
      const wrapper = btn.closest('.mermaid-wrapper');
      wrapper.classList.toggle('show-source');
      btn.textContent = wrapper.classList.contains('show-source') ? 'Diagram' : 'Source';
    }
    
    // Docsify plugin for Mermaid with toggle
    window.$docsify.plugins = (window.$docsify.plugins || []).concat(function(hook) {
      hook.afterEach(function(html) {
        return html.replace(/<pre[^>]*data-lang="mermaid"[^>]*><code[^>]*>([\s\S]*?)<\/code><\/pre>/gi, 
          function(match, code) {
            // Decode HTML entities back to original
            const decoded = code
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'");
            const escaped = code;  // Keep escaped version for source view
            return `<div class="mermaid-wrapper">
              <button class="mermaid-toggle" onclick="toggleMermaid(this)">Source</button>
              <div class="mermaid-diagram mermaid">${decoded}</div>
              <pre class="mermaid-source">${escaped}</pre>
            </div>`;
          });
      });
      hook.doneEach(function() {
        try {
          mermaid.init(undefined, document.querySelectorAll('.mermaid:not([data-processed])'));
        } catch (e) {
          console.error('Mermaid init error:', e);
        }
      });
    });
  </script>
</body>
</html>
